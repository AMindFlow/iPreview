name: Desktop builds

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test catalog
        run: swift run iPreviewCoreChecks
      - name: Assemble application
        run: bash scripts/package-macos.sh "${RUNNER_TEMP}/iPreview-macos-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iPreview-macos-arm64
          path: ${{ runner.temp }}/iPreview-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test catalog
        run: dotnet run --project apps/windows/CoreChecks/CoreChecks.csproj -c Release
      - name: Publish unpackaged application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'iPreview'
          $zip = Join-Path $env:RUNNER_TEMP 'iPreview-windows-x64.zip'
          dotnet publish apps/windows/iPreview/iPreview.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path (Join-Path $publish 'iPreview.exe'))) { throw 'Published app executable missing' }
          Compress-Archive -Path "$publish\*" -DestinationPath $zip
          Get-FileHash -Algorithm SHA256 $zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iPreview-windows-x64
          path: ${{ runner.temp }}/iPreview-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
