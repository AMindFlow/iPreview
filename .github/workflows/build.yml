name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test catalog
        run: swift run iPreviewCoreChecks
      - name: Assemble application
        run: bash scripts/package-macos.sh "${RUNNER_TEMP}/iPreview-macos-arm64.zip"
      - name: Assemble disk image
        run: bash scripts/package-macos-dmg.sh "${RUNNER_TEMP}/iPreview-macos-arm64.zip" "${RUNNER_TEMP}/iPreview-macos-arm64.dmg"
      - name: Archive corresponding LibVLC source
        run: python3 scripts/libvlc-runtime.py source "${RUNNER_TEMP}/libvlc-source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libvlc-corresponding-source
          path: ${{ runner.temp }}/libvlc-source
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iPreview-macos-arm64
          path: ${{ runner.temp }}/iPreview-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iPreview-macos-arm64-dmg
          path: ${{ runner.temp }}/iPreview-macos-arm64.dmg
          if-no-files-found: error
          compression-level: 0

  macos15:
    name: macOS 15 launch
    needs: macos
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iPreview-macos-arm64
          path: ${{ runner.temp }}/ipreview-macos15
      - name: Launch packaged application and check catalog
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          case "$(sw_vers -productVersion)" in
            15|15.*) ;;
            *) echo "Expected macOS 15"; exit 1 ;;
          esac
          test "$(uname -m)" = arm64
          qa="$(mktemp -d "${RUNNER_TEMP}/ipreview-launch.XXXXXX")"
          ditto -x -k "${RUNNER_TEMP}/ipreview-macos15/iPreview-macos-arm64.zip" "$qa"
          app="$qa/iPreview.app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Frameworks/LibVLC/lib/libvlc.dylib"
          test -f "$app/Contents/Frameworks/LibVLC/lib/vlc/plugins/libmkv_plugin.dylib"

          export IPREVIEW_DATA_DIR="$qa/catalog"
          "$app/Contents/MacOS/iPreview" >"$qa/launch.log" 2>&1 &
          app_pid=$!
          cleanup() {
            local status=$?
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            if [[ "$status" -ne 0 ]]; then cat "$qa/launch.log"; fi
          }
          trap cleanup EXIT

          database="$IPREVIEW_DATA_DIR/catalog.sqlite3"
          for ((attempt = 0; attempt < 20; attempt++)); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "The packaged application exited during launch"
              exit 1
            fi
            if [[ -s "$database" ]] &&
               [[ "$(sqlite3 -bail -readonly "$database" "SELECT name FROM sqlite_master WHERE type='table' AND name='pending_rename';" 2>/dev/null)" == pending_rename ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$attempt" -eq 20 ]]; then
            echo "The packaged application did not migrate its catalog"
            exit 1
          fi
          version="$(sqlite3 -bail -readonly "$database" 'PRAGMA user_version;')"
          test "$version" -ge 2
          sleep 3
          kill -0 "$app_pid"
          echo "iPreview stayed running on macOS 15 arm64 and opened catalog schema $version"

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test catalog
        run: dotnet run --project apps/windows/CoreChecks/CoreChecks.csproj -c Release
      - name: Publish unpackaged application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'iPreview'
          $zip = Join-Path $env:RUNNER_TEMP 'iPreview-windows-x64.zip'
          dotnet publish apps/windows/iPreview/iPreview.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/libvlc-runtime.py stage (Join-Path $publish 'LibVLC') --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$publish\*" -DestinationPath $zip
          $expanded = Join-Path $env:RUNNER_TEMP 'iPreview-expanded'
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          foreach ($file in 'iPreview.exe', 'iPreview.pri', 'App.xbf', 'MainWindow.xbf', 'Assets/AppIcon.ico') {
            if (!(Test-Path -LiteralPath (Join-Path $expanded $file) -PathType Leaf)) {
              throw "Windows ZIP is missing $file"
            }
          }
          python scripts/libvlc-runtime.py check (Join-Path $expanded 'LibVLC') --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 $zip
      - name: Launch packaged application and check catalog
        shell: pwsh
        run: ./scripts/check-windows-launch.ps1 -Application (Join-Path $env:RUNNER_TEMP 'iPreview-expanded\iPreview.exe')
      - name: Build and verify per-user installer
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'iPreview'
          $output = Join-Path $env:RUNNER_TEMP 'iPreview-installer'
          ./scripts/package-windows.ps1 -PublishDirectory $publish -OutputDirectory $output
          $installer = (Get-ChildItem -LiteralPath $output -Filter '*.exe').FullName
          ./scripts/check-windows-installer.ps1 -Installer $installer -PublishDirectory $publish -EvidenceDirectory (Join-Path $output 'checks')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iPreview-windows-x64
          path: ${{ runner.temp }}/iPreview-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: iPreview-windows-installer
          path: ${{ runner.temp }}/iPreview-installer
          if-no-files-found: error
          compression-level: 0
