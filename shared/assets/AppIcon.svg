<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">iPreview</title>
  <desc id="description">A blue nebula with white starlight, framed by blue and cyan orbits carrying images, video, and a disc.</desc>
  <defs>
    <linearGradient id="tile" x1="0" x2="0" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f7fafd"/>
    </linearGradient>
    <linearGradient id="tile-rim" x1="0" x2="0" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff"/>
      <stop offset=".64" stop-color="#edf4f9"/>
      <stop offset="1" stop-color="#dfebf6"/>
    </linearGradient>
    <radialGradient id="orbit-reflection">
      <stop stop-color="#24c9f1" stop-opacity=".45"/>
      <stop offset=".52" stop-color="#6cdef9" stop-opacity=".29"/>
      <stop offset="1" stop-color="#c8f5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outer-orbit" x1="166" y1="510" x2="844" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59a9ee"/>
      <stop offset=".42" stop-color="#8ecdf6"/>
      <stop offset=".73" stop-color="#9ce9fa"/>
      <stop offset="1" stop-color="#56cce9"/>
    </linearGradient>
    <linearGradient id="inner-orbit" x1="199" y1="402" x2="822" y2="562" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77b9f2"/>
      <stop offset=".53" stop-color="#b0e7fb"/>
      <stop offset="1" stop-color="#6ed9ed"/>
    </linearGradient>
    <linearGradient id="orbit-glint" x1="182" y1="483" x2="828" y2="483" gradientUnits="userSpaceOnUse">
      <stop stop-color="#effbff" stop-opacity=".2"/>
      <stop offset=".59" stop-color="#f0ffff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#e8fbff" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="nebula" cx=".64" cy=".43" r=".72" fx=".62" fy=".43">
      <stop stop-color="#121e6e"/>
      <stop offset=".35" stop-color="#1736ab"/>
      <stop offset=".62" stop-color="#2165e3"/>
      <stop offset=".8" stop-color="#32b1f0"/>
      <stop offset=".95" stop-color="#7fe7f7"/>
      <stop offset="1" stop-color="#caf8ff"/>
    </radialGradient>
    <radialGradient id="violet-cloud">
      <stop stop-color="#eeafff"/>
      <stop offset=".27" stop-color="#b97afc"/>
      <stop offset=".67" stop-color="#6940e9" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6146d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-cloud">
      <stop stop-color="#9dfffb"/>
      <stop offset=".29" stop-color="#32f2f5" stop-opacity=".92"/>
      <stop offset=".59" stop-color="#0acabf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0abfeb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spiral-light" x1="391" y1="455" x2="626" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43c4ff" stop-opacity=".12"/>
      <stop offset=".29" stop-color="#78fcff" stop-opacity=".91"/>
      <stop offset=".64" stop-color="#28ddfc" stop-opacity=".62"/>
      <stop offset="1" stop-color="#84a7fb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spiral-violet" x1="445" y1="390" x2="665" y2="535" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e5c1ff" stop-opacity=".17"/>
      <stop offset=".3" stop-color="#f0b7ff" stop-opacity=".79"/>
      <stop offset=".64" stop-color="#9573ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#b98cf9" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="sphere-rim" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ddf9ff" stop-opacity=".6"/>
      <stop offset=".32" stop-color="#fad0ff" stop-opacity=".53"/>
      <stop offset=".65" stop-color="#bcabff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#b4f8ff" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="star-aura">
      <stop stop-color="#e2f7ff" stop-opacity=".83"/>
      <stop offset=".4" stop-color="#99bdff" stop-opacity=".37"/>
      <stop offset="1" stop-color="#87a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="satellite" cx=".41" cy=".36" r=".68" fx=".28" fy=".24">
      <stop stop-color="#f1ffff"/>
      <stop offset=".25" stop-color="#baf5ff"/>
      <stop offset=".58" stop-color="#69d9f7"/>
      <stop offset=".84" stop-color="#3faee9"/>
      <stop offset="1" stop-color="#8de4ff"/>
    </radialGradient>
    <linearGradient id="glass-edge" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#d3f9ff"/>
      <stop offset=".31" stop-color="#6dcdf6"/>
      <stop offset=".65" stop-color="#369fda"/>
      <stop offset="1" stop-color="#76dff4"/>
    </linearGradient>
    <linearGradient id="glass-face" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#159ed9"/>
      <stop offset=".42" stop-color="#55bfec"/>
      <stop offset=".76" stop-color="#7cddf7"/>
      <stop offset="1" stop-color="#d8fbff"/>
    </linearGradient>
    <linearGradient id="glass-glyph" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#b0e9fc"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#effbff"/>
      <stop offset=".25" stop-color="#9ce8ff"/>
      <stop offset=".44" stop-color="#69b7f1"/>
      <stop offset=".7" stop-color="#c9f8ff"/>
      <stop offset="1" stop-color="#6dccf6"/>
    </linearGradient>
    <filter id="soft-cloud" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft-glint" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="sphere-clip">
      <circle cx="510" cy="493" r="170"/>
    </clipPath>
    <ellipse id="outer-ring" cx="510" cy="493" rx="354" ry="183" transform="rotate(-24 510 493)"/>
    <ellipse id="inner-ring" cx="510" cy="493" rx="313" ry="145" transform="rotate(11 510 493)"/>
    <clipPath id="outer-near">
      <rect x="146" y="493" width="728" height="193" transform="rotate(-24 510 493)"/>
    </clipPath>
    <clipPath id="inner-near">
      <rect x="187" y="493" width="646" height="155" transform="rotate(11 510 493)"/>
    </clipPath>
    <clipPath id="outer-under-crossings">
      <circle cx="216.4" cy="493" r="38"/>
      <circle cx="409.2" cy="338.6" r="44"/>
    </clipPath>
    <clipPath id="inner-under-crossings">
      <circle cx="803.6" cy="493" r="38"/>
      <circle cx="610.8" cy="647.4" r="44"/>
    </clipPath>
    <mask id="outer-crossing-depth" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#inner-ring" clip-path="url(#outer-under-crossings)" fill="none" stroke="#000" stroke-width="24"/>
    </mask>
    <mask id="inner-crossing-depth" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#outer-ring" clip-path="url(#inner-under-crossings)" fill="none" stroke="#000" stroke-width="27"/>
    </mask>
    <g id="outer-orbit-art" fill="none" mask="url(#outer-crossing-depth)">
      <use href="#outer-ring" stroke="url(#outer-orbit)" stroke-width="16"/>
      <use href="#outer-ring" stroke="url(#orbit-glint)" stroke-width="3"/>
    </g>
    <g id="inner-orbit-art" fill="none" mask="url(#inner-crossing-depth)">
      <use href="#inner-ring" stroke="url(#inner-orbit)" stroke-width="13"/>
      <use href="#inner-ring" stroke="url(#orbit-glint)" stroke-width="2"/>
    </g>
  </defs>

  <rect x="89" y="92" width="846" height="846" rx="216" fill="#6d8aa8" opacity=".11" filter="url(#soft-glint)"/>
  <rect x="91" y="91" width="842" height="842" rx="213" fill="url(#tile)" stroke="url(#tile-rim)" stroke-width="2"/>
  <ellipse cx="510" cy="715" rx="303" ry="110" transform="rotate(5 510 715)" fill="url(#orbit-reflection)"/>

  <use href="#outer-orbit-art"/>
  <use href="#inner-orbit-art"/>

  <g id="nebula-sphere">
    <circle cx="510" cy="493" r="170" fill="url(#nebula)"/>
    <g clip-path="url(#sphere-clip)">
      <ellipse cx="525" cy="373" rx="172" ry="108" transform="rotate(-12 525 373)" fill="url(#violet-cloud)"/>
      <ellipse cx="672" cy="519" rx="98" ry="143" transform="rotate(16 672 519)" fill="url(#violet-cloud)" opacity=".79"/>
      <ellipse cx="426" cy="575" rx="185" ry="147" transform="rotate(29 426 575)" fill="url(#cyan-cloud)" opacity=".77"/>
      <path d="M 383 454 C 366 498 392 526 431 531 C 478 537 484 561 508 578 C 550 611 591 555 633 587"
            fill="none" stroke="url(#spiral-light)" stroke-width="31" stroke-linecap="round" filter="url(#soft-cloud)"/>
      <path d="M 407 448 C 395 488 408 513 438 521 C 463 528 469 529 486 547 C 526 592 566 576 581 574 C 607 571 622 575 638 588"
            fill="none" stroke="url(#spiral-light)" stroke-width="10" stroke-linecap="round" filter="url(#soft-glint)" opacity=".88"/>
      <path d="M 406 417 C 467 417 454 365 525 359 C 598 348 617 411 645 453 C 678 502 622 545 566 552"
            fill="none" stroke="url(#spiral-violet)" stroke-width="18" stroke-linecap="round" filter="url(#soft-cloud)"/>
      <path d="M 450 392 C 487 372 500 357 534 362 C 593 371 598 400 625 427"
            fill="none" stroke="url(#spiral-violet)" stroke-width="6" stroke-linecap="round" filter="url(#soft-glint)" opacity=".76"/>
      <circle cx="583" cy="431" r="52" fill="url(#star-aura)"/>
      <circle cx="534" cy="483" r="24" fill="url(#star-aura)" opacity=".74"/>
      <path d="M 583 396 C 588 421 593 426 619 431 C 593 436 588 441 583 466 C 578 441 573 436 547 431 C 573 426 578 421 583 396 Z"
            fill="#f7fcff"/>
      <path d="M 534 473 Q 536 481 544 483 Q 536 485 534 493 Q 532 485 524 483 Q 532 481 534 473 Z" fill="#f4fcff"/>
      <g fill="#c9ebff" opacity=".64">
        <circle cx="459" cy="435" r="2"/>
        <circle cx="610" cy="472" r="1.8"/>
        <circle cx="551" cy="517" r="2.4"/>
        <circle cx="633" cy="403" r="1.6"/>
        <circle cx="498" cy="466" r="1.5"/>
      </g>
    </g>
    <circle cx="510" cy="493" r="169" fill="none" stroke="url(#sphere-rim)" stroke-width="2"/>
  </g>

  <g clip-path="url(#sphere-clip)">
    <use href="#outer-orbit-art" clip-path="url(#outer-near)"/>
    <use href="#inner-orbit-art" clip-path="url(#inner-near)"/>
  </g>

  <g id="orbiting-planets" fill="url(#satellite)" stroke="#d9faff" stroke-width="1.4">
    <circle cx="186.6" cy="637" r="12"/>
    <circle cx="623.7" cy="274.4" r="16"/>
    <circle cx="434.6" cy="624.2" r="20"/>
  </g>

  <g id="photo-stack" transform="translate(310.5 398.8) rotate(-20)">
    <rect x="-59" y="-39" width="116" height="97" rx="17" fill="#25b8ec" opacity=".37" filter="url(#soft-cloud)"/>
    <rect x="-63" y="-49" width="106" height="94" rx="14" fill="#75d3f2" stroke="#d4f8ff" stroke-width="1.5" transform="rotate(-9)"/>
    <rect x="-54" y="-43" width="108" height="94" rx="14" fill="url(#glass-edge)" stroke="#d4f8ff" stroke-width="1.5" transform="rotate(-4)"/>
    <rect x="-44" y="-35" width="109" height="94" rx="14" fill="url(#glass-face)" stroke="#bff2ff" stroke-width="2"/>
    <rect x="-35" y="-26" width="91" height="76" rx="9" fill="#168cca" fill-opacity=".28" stroke="#e7fdff" stroke-opacity=".51"/>
    <circle cx="30" cy="-10" r="8" fill="url(#glass-glyph)"/>
    <path d="M -28 31 L -7 9 Q -2 4 3 9 L 18 22 L 31 10 Q 36 6 41 11 L 49 19 V 33 Q 49 38 44 38 H -23 Q -30 38 -28 31 Z" fill="url(#glass-glyph)"/>
  </g>

  <g id="video-cassette" transform="translate(287.8 706.8) rotate(17) skewX(-9)">
    <rect x="-63" y="-34" width="128" height="74" rx="13" fill="#209ddb" opacity=".27" filter="url(#soft-glint)"/>
    <rect x="-61" y="-33" width="123" height="72" rx="12" fill="#177fb5" stroke="#83ddfb" stroke-width="1.8"/>
    <rect x="-61" y="-39" width="123" height="73" rx="11" fill="url(#glass-edge)" stroke="#ddfaff" stroke-width="1.4"/>
    <rect x="-53" y="-30" width="107" height="53" rx="8" fill="#238bad" stroke="#a3e6f8" stroke-width="1.4"/>
    <g fill="#c0f2ff" stroke="#71c5e8" stroke-width="2">
      <circle cx="-34" cy="-3" r="17"/>
      <circle cx="34" cy="-3" r="17"/>
    </g>
    <g fill="#43a0c6">
      <circle cx="-34" cy="-3" r="7"/>
      <circle cx="34" cy="-3" r="7"/>
    </g>
    <rect x="-23" y="-24" width="46" height="42" rx="4" fill="url(#glass-glyph)"/>
    <path d="M -6 -16 L 10 -7 L -6 2 Z" fill="#188bbc"/>
    <path d="M -14 9 H 15 M -14 13 H 8" stroke="#54b1d0" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <g id="optical-disc" transform="translate(759.1 617.5) rotate(-8) skewX(-12)">
    <rect x="-52" y="-42" width="103" height="88" rx="12" fill="#259ddb" opacity=".26" filter="url(#soft-glint)"/>
    <rect x="-51" y="-44" width="102" height="87" rx="11" fill="url(#glass-edge)" stroke="#c8f6ff" stroke-width="1.6"/>
    <rect x="-43" y="-46" width="94" height="87" rx="10" fill="url(#glass-face)" stroke="#e2fcff" stroke-width="2"/>
    <rect x="-35" y="-38" width="78" height="71" rx="7" fill="#248cbd" stroke="#b7edff" stroke-opacity=".7"/>
    <circle cx="4" cy="-2" r="32" fill="url(#disc)" stroke="#d8f8ff" stroke-width="1.5"/>
    <path d="M 2 -2 L -1 -34 A 32 32 0 0 1 26 -26 Z M 7 1 L 16 28 A 32 32 0 0 1 -7 28 Z" fill="#e7fcff" opacity=".55"/>
    <circle cx="4" cy="-2" r="10.5" fill="#9ae1f3" stroke="#e1f9ff" stroke-width="1.2"/>
    <circle cx="4" cy="-2" r="5" fill="#3e9fc4"/>
  </g>
</svg>
